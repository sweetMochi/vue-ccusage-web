<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860" font-family="'Segoe UI','Noto Sans TC',system-ui,sans-serif">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b0b0b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 頁面背景 (base-200) -->
  <rect width="1180" height="860" fill="#f4f3ee"/>

  <!-- 預覽說明 -->
  <text x="30" y="34" font-size="13" fill="#52514e">Weekly limits 規劃 — 儀表板版面預覽（亮色主題）</text>

  <!-- 頁首 -->
  <text x="30" y="92" font-size="20" font-weight="700" fill="#0b0b0b">Claude Token Usage</text>
  <text x="948" y="90" font-size="12" fill="#8a8983" text-anchor="end">更新於 14:32:05</text>
  <text x="972" y="91" font-size="14" fill="#52514e" text-anchor="middle">↻</text>
  <!-- 主題切換 -->
  <g>
    <rect x="994" y="74" width="156" height="24" rx="6" fill="#fcfcfb" stroke="#e1e0d9"/>
    <rect x="1046" y="76" width="52" height="20" rx="4" fill="#e1e0d9"/>
    <text x="1020" y="90" font-size="11" fill="#52514e" text-anchor="middle">預設</text>
    <text x="1072" y="90" font-size="11" font-weight="600" fill="#0b0b0b" text-anchor="middle">亮</text>
    <text x="1124" y="90" font-size="11" fill="#52514e" text-anchor="middle">暗</text>
  </g>

  <!-- ─── 卡片一：距離重置 ─── -->
  <g>
    <rect x="30" y="120" width="360" height="330" rx="16" fill="#fcfcfb" filter="url(#cardShadow)"/>
    <text x="54" y="156" font-size="13" font-weight="500" fill="#52514e">距離重置</text>
    <circle cx="210" cy="290" r="80" fill="none" stroke="#e1e0d9" stroke-width="8"/>
    <circle cx="210" cy="290" r="80" fill="none" stroke="#2a78d6" stroke-width="8"
            stroke-linecap="round" stroke-dasharray="281.5 502.7" transform="rotate(-90 210 290)"/>
    <text x="210" y="297" font-size="21" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">02:47:12</text>
    <text x="210" y="420" font-size="11" fill="#52514e" text-anchor="middle">block 剩餘 56%</text>
  </g>

  <!-- ─── 卡片二：Token 用量(5 小時) — 改用官方百分比 ─── -->
  <g>
    <rect x="410" y="120" width="360" height="330" rx="16" fill="#fcfcfb" filter="url(#cardShadow)"/>
    <text x="434" y="156" font-size="13" font-weight="500" fill="#52514e">Token 用量（5 小時）</text>
    <rect x="694" y="134" width="52" height="22" rx="11" fill="#f1efe8"/>
    <text x="720" y="149" font-size="11" fill="#52514e" text-anchor="middle">調整</text>
    <!-- gauge 軌道 210° → -30° -->
    <path d="M 516.4 332.5 A 85 85 0 1 1 663.6 332.5" fill="none" stroke="#e1e0d9" stroke-width="10" stroke-linecap="round"/>
    <!-- 進度 24% -->
    <path d="M 516.4 332.5 A 85 85 0 0 1 514.7 250.6" fill="none" stroke="#2a78d6" stroke-width="10" stroke-linecap="round"/>
    <text x="590" y="288" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="middle">24%</text>
    <text x="590" y="310" font-size="12" fill="#52514e" text-anchor="middle">12.4M tokens</text>
    <text x="590" y="420" font-size="11" fill="#52514e" text-anchor="middle">官方 5 小時限額（statusline）・無資料時退回歷史最高估算</text>
  </g>

  <!-- ─── 卡片三：本週用量(Weekly) — 新增 ─── -->
  <g>
    <rect x="790" y="120" width="360" height="330" rx="16" fill="#fcfcfb" filter="url(#cardShadow)"/>
    <text x="814" y="156" font-size="13" font-weight="500" fill="#52514e">本週用量</text>
    <rect x="1074" y="134" width="52" height="22" rx="11" fill="#e7f0fb"/>
    <text x="1100" y="149" font-size="11" fill="#1d5aa8" text-anchor="middle">新增</text>
    <path d="M 896.4 332.5 A 85 85 0 1 1 1043.6 332.5" fill="none" stroke="#e1e0d9" stroke-width="10" stroke-linecap="round"/>
    <!-- 進度 41% -->
    <path d="M 896.4 332.5 A 85 85 0 0 1 938.7 211.0" fill="none" stroke="#2a78d6" stroke-width="10" stroke-linecap="round"/>
    <text x="970" y="288" font-size="26" font-weight="600" fill="#0b0b0b" text-anchor="middle">41%</text>
    <text x="970" y="310" font-size="12" fill="#52514e" text-anchor="middle">重置於 07/15（二）09:00</text>
    <text x="970" y="420" font-size="11" fill="#52514e" text-anchor="middle">官方 7 日限額（statusline rate_limits.seven_day）</text>
  </g>

  <!-- ─── 卡片四：Token 組成 ─── -->
  <g>
    <rect x="30" y="470" width="360" height="330" rx="16" fill="#fcfcfb" filter="url(#cardShadow)"/>
    <text x="54" y="506" font-size="13" font-weight="500" fill="#52514e">Token 組成</text>
    <!-- 甜甜圈：C = 408.4，各段預留 3px 表面間隔 -->
    <g transform="translate(145 655)">
      <circle r="65" fill="none" stroke="#2a78d6" stroke-width="26" stroke-dasharray="5.2 403.2" transform="rotate(-90)"/>
      <circle r="65" fill="none" stroke="#1baf7a" stroke-width="26" stroke-dasharray="21.5 386.9" transform="rotate(-82.8)"/>
      <circle r="65" fill="none" stroke="#eda100" stroke-width="26" stroke-dasharray="323.7 84.7" transform="rotate(-61.2)"/>
      <circle r="65" fill="none" stroke="#008300" stroke-width="26" stroke-dasharray="46 362.4" transform="rotate(226.8)"/>
      <text y="0" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="middle">12.4M</text>
      <text y="16" font-size="10" fill="#52514e" text-anchor="middle">tokens</text>
    </g>
    <!-- 圖例 -->
    <g font-size="11" fill="#52514e">
      <rect x="252" y="580" width="10" height="10" rx="2" fill="#2a78d6"/><text x="268" y="589">input 2%</text>
      <rect x="252" y="606" width="10" height="10" rx="2" fill="#1baf7a"/><text x="268" y="615">output 6%</text>
      <rect x="252" y="632" width="10" height="10" rx="2" fill="#eda100"/><text x="268" y="641">cache read 80%</text>
      <rect x="252" y="658" width="10" height="10" rx="2" fill="#008300"/><text x="268" y="667">cache creation 12%</text>
    </g>
  </g>

  <!-- ─── 卡片五：燃燒速率 ─── -->
  <g>
    <rect x="410" y="470" width="360" height="330" rx="16" fill="#fcfcfb" filter="url(#cardShadow)"/>
    <text x="434" y="506" font-size="13" font-weight="500" fill="#52514e">燃燒速率</text>
    <text x="434" y="560" font-size="24" font-weight="600" fill="#0b0b0b">24.5K</text>
    <text x="434" y="580" font-size="11" fill="#52514e">tokens / 分</text>
    <text x="610" y="560" font-size="24" font-weight="600" fill="#0b0b0b">$0.83</text>
    <text x="610" y="580" font-size="11" fill="#52514e">費用 / 小時</text>
    <!-- 迷你趨勢線 -->
    <polyline points="434,742 470,730 506,736 542,714 578,722 614,700 650,706 686,688 722,694 746,678"
              fill="none" stroke="#2a78d6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M434,742 L470,730 L506,736 L542,714 L578,722 L614,700 L650,706 L686,688 L722,694 L746,678 L746,764 L434,764 Z"
          fill="#2a78d6" fill-opacity="0.08" stroke="none"/>
    <text x="434" y="782" font-size="10" fill="#8a8983">近 30 分鐘取樣</text>
  </g>

  <!-- ─── 卡片六：預估用量 ─── -->
  <g>
    <rect x="790" y="470" width="360" height="330" rx="16" fill="#fcfcfb" filter="url(#cardShadow)"/>
    <text x="814" y="506" font-size="13" font-weight="500" fill="#52514e">預估用量</text>
    <g font-size="13">
      <text x="814" y="570" fill="#52514e">預估總 tokens</text>
      <text x="1126" y="570" fill="#0b0b0b" font-weight="600" text-anchor="end">6.86M</text>
      <line x1="814" y1="592" x2="1126" y2="592" stroke="#e1e0d9"/>
      <text x="814" y="630" fill="#52514e">預估總費用</text>
      <text x="1126" y="630" fill="#0b0b0b" font-weight="600" text-anchor="end">$3.87</text>
      <line x1="814" y1="652" x2="1126" y2="652" stroke="#e1e0d9"/>
      <text x="814" y="690" fill="#52514e">距 block 結束</text>
      <text x="1126" y="690" fill="#0b0b0b" font-weight="600" text-anchor="end">258 分</text>
    </g>
  </g>
</svg>
